<!doctype html>
<html lang="en" class="bg-zinc-950">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#09090b"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f4f4f5"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="F1 Pitwall" />
    <link rel="icon" type="image/png" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="./fonts/Formula1-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/Formula1-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/Formula1-Black.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/Formula1-Wide.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>F1 Pitwall</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("theme") ?? "system";
    </script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100 antialiased">
    <div id="root" class="overflow-x-clip"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
